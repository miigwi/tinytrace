; Tinytrace — firmware for the Adafruit ESP32-S3 Reverse TFT Feather
; (1.14" 240x135). One image, two apps behind a boot launcher (main.cpp):
;   TINYTRACE     — the standalone Dynatrace desk panel
;   TRACE RUNNER  — a one-button noir endless runner (D1 = jump)
; On reset the launcher menu picks which app owns the device (D0/D2 move, D1
; selects); hold D0 while selecting TINYTRACE to force provisioning.
;
;   pio run -e tinytrace -t upload -t monitor
;
; Standalone: the panel talks directly to a Dynatrace Grail tenant over HTTPS
; with a read-only platform token (provisioned via captive portal into NVS).
;
; Display driver: Adafruit_ST7789 + Adafruit_GFX. TFT_eSPI was tried first but
; its init() hard-faults (crash-reboot loop) on this S3 board regardless of pin,
; clock or MISO config; the vendor driver initialises cleanly. Display/LED/button
; pins all come from Adafruit's board variant (pins_arduino.h). Reference:
; https://learn.adafruit.com/esp32-s3-reverse-tft-feather

[env:tinytrace]
; Pinned: an unpinned platform silently jumps majors. 6.x/7.x still ship Arduino
; core 2.0.17 (ESP-IDF 4.4, end of life); 8.x is core 3.3 on a patched IDF 5.5.
platform = espressif32 @ ~8.0.0
board = adafruit_feather_esp32s3_reversetft
; Core 3.x no longer fits the board's default 1408K OTA slot. Nothing here does
; OTA, so use the single-slot TinyUF2 layout: 2816K app, with NVS (settings) and
; the UF2 bootloader at the same offsets, so a reflash keeps both.
board_build.partitions = tinyuf2-partitions-4MB-noota.csv
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; The S3's native USB can't be auto-reset into the bootloader while the app is
; crashing (the 1200bps-touch trick needs the running app to cooperate). So we
; flash with the board held manually in the ROM bootloader instead:
;   hold BOOT → tap RESET → release BOOT, then upload.
; After flashing, tap RESET to run the app (esptool's RTS reset doesn't boot it).
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no

; Stamps TT_BUILD with the git commit, so a board can say which build it is
; running instead of needing a flash byte-compare to find out.
extra_scripts = pre:version.py

lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    adafruit/Adafruit NeoPixel@^1.15.5
    adafruit/Adafruit ST7735 and ST7789 Library@^1.12.0
    adafruit/Adafruit GFX Library@^1.13.0
    ; MAX17048 fuel gauge — this board has no analog VBAT divider, so battery
    ; percentage and charge rate only come over I2C (0x36).
    adafruit/Adafruit MAX1704X@^1.0.3

build_flags =
    ; Route Serial to the native USB so `-t monitor` shows output (also a board
    ; default; kept explicit).
    -D ARDUINO_USB_CDC_ON_BOOT=1

    ; ---------- tinytrace ----------
    ; Landscape. 1 and 3 are 180° apart; pick whichever matches how it's mounted.
    -D TT_ROTATION=1
    ; Local timezone (POSIX TZ string). No longer drawn on the panel — the header
    ; clock was dropped to give the title its width back — but it still sets the
    ; device clock via SNTP. Default Central European with DST.
    -D 'TT_TZ="CET-1CEST,M3.5.0,M10.5.0/3"'
    ; How long a press of the middle button counts as "long" (jump to idle).
    -D TT_LONGPRESS_MS=800
    ; Blank the panel after this long untouched; any button wakes it.
    -D TT_SLEEP_MS=300000
