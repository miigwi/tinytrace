; Tinytrace — firmware for the Adafruit ESP32-S3 Reverse TFT Feather
; (1.14" 240x135). A tiny standalone Dynatrace desk panel.
;
;   pio run -e tinytrace -t upload -t monitor
;
; Standalone: the device talks directly to a Dynatrace Grail tenant over HTTPS
; with a read-only platform token (provisioned via captive portal into NVS).
;
; Display driver: Adafruit_ST7789 + Adafruit_GFX. TFT_eSPI was tried first but
; its init() hard-faults (crash-reboot loop) on this S3 board regardless of pin,
; clock or MISO config; the vendor driver initialises cleanly. Display/LED/button
; pins all come from Adafruit's board variant (pins_arduino.h). Reference:
; https://learn.adafruit.com/esp32-s3-reverse-tft-feather

[env:tinytrace]
platform = espressif32
board = adafruit_feather_esp32s3_reversetft
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; The S3's native USB can't be auto-reset into the bootloader while the app is
; crashing (the 1200bps-touch trick needs the running app to cooperate). So we
; flash with the board held manually in the ROM bootloader instead:
;   hold BOOT → tap RESET → release BOOT, then upload.
; After flashing, tap RESET to run the app (esptool's RTS reset doesn't boot it).
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit NeoPixel@^1.12.0
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    adafruit/Adafruit GFX Library@^1.11.9

build_flags =
    ; Route Serial to the native USB so `-t monitor` shows output (also a board
    ; default; kept explicit).
    -D ARDUINO_USB_CDC_ON_BOOT=1

    ; ---------- dynaglance ----------
    ; Landscape. 1 and 3 are 180° apart; pick whichever matches how it's mounted.
    -D DG_ROTATION=1
    ; Local timezone (POSIX TZ string) for the on-panel clock. Default Central
    ; European with DST; change for your locale.
    -D 'DG_TZ="CET-1CEST,M3.5.0,M10.5.0/3"'
    ; How long a press of the middle button counts as "long" (jump to idle).
    -D DG_LONGPRESS_MS=800
    ; Blank the panel after this long untouched; any button wakes it.
    -D DG_SLEEP_MS=300000
